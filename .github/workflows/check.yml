name: Check
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test test/*.test.cjs
      - run: node scripts/pack.mjs
      # 用通配符取产物：写死版本号会在每次发版后把这一步打红。
      - run: tar -tzf dsh-model-shelf-*.tgz
