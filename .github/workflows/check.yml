name: Check
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test test/*.test.cjs
      - run: node scripts/pack.mjs
      - run: tar -tzf dsh-model-shelf-0.1.1.tgz
